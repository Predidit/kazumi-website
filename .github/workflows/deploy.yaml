name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Fetch Upstream Data"]
    branches: [main]
    types: [ completed ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Failed upstream runs must not cancel an active deployment.
  group: pages-${{ github.ref }}-${{ github.event.workflow_run.conclusion || 'success' }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Prepare optimized assets
        uses: ./.github/actions/prepare-assets

      - name: Build
        run: bun run build

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/analog/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
